name: Deploy Future Finders email API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy Worker
        working-directory: future-finders/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Add private runtime secrets
        working-directory: future-finders/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          IDEA_RECIPIENT_EMAIL: ${{ secrets.IDEA_RECIPIENT_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RESEND_API_KEY" | wrangler secret put RESEND_API_KEY --name future-finders-api
          printf '%s' "$RESEND_FROM_EMAIL" | wrangler secret put RESEND_FROM_EMAIL --name future-finders-api
          printf '%s' "$IDEA_RECIPIENT_EMAIL" | wrangler secret put IDEA_RECIPIENT_EMAIL --name future-finders-api
