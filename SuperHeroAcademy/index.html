<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Super Hero Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#06101c}
canvas{display:block;width:100%;height:100%;background:linear-gradient(#79c9ff,#dff5ff 62%,#3b8b3f 62%,#245d2a)}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;background:radial-gradient(circle at 50% 40%,#294866,#060a10 72%);z-index:5;text-align:center}
#menu h1{font-size:clamp(42px,7vw,82px);text-shadow:0 0 18px #0ff,0 0 34px #8a2be2}
#menu button{font-size:24px;font-weight:bold;padding:14px 34px;border:0;border-radius:12px;cursor:pointer;background:#fff;color:#111;box-shadow:0 0 18px #fff}
.hint{opacity:.9;font-size:16px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="menu">
<h1>SUPER HERO ACADEMY</h1>
<div class="hint">Hero: Ethan</div>
<div class="hint">Survive for one minute to win!</div>
<button id="startBtn">START GAME</button>
</div>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);

const keys={};
let gameOver=false,gameWon=false,startTime=0;
const SURVIVAL_TIME=60000;

const player={x:180,y:400,w:42,h:62,speed:5,flySpeed:7,flying:false,hp:100,invisible:false};
let velocityY=0;

const earthWalls=[],projectiles=[],explosions=[];

const students=[
{name:'Ava',x:430,y:260,vx:1.8,vy:1.2,cooldown:0,power:'⚡'},
{name:'Marcus',x:760,y:350,vx:-1.5,vy:1.6,cooldown:30,power:'🔥'},
{name:'Nyx',x:1050,y:220,vx:1.3,vy:-1.7,cooldown:60,power:'❄️'},
{name:'Leo',x:900,y:500,vx:-1.8,vy:-1.1,cooldown:90,power:'🌪️'}
];

function resetGame(){
  gameOver=false;gameWon=false;startTime=performance.now();
  player.x=180;player.y=Math.min(400,canvas.height-150);player.hp=100;
  player.invisible=false;player.flying=false;velocityY=0;
  projectiles.length=0;earthWalls.length=0;explosions.length=0;
  students.forEach((s,i)=>{
    s.x=320+i*190;s.y=180+(i%2)*180;
    s.vx=(Math.random()*3-1.5)||1;s.vy=(Math.random()*3-1.5)||1;
    s.cooldown=i*20;
  });
}

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerRect(){return{x:player.x,y:player.y,w:player.w,h:player.h}}
function wallRect(){return{x:player.x+player.w+18,y:player.y-8,w:76,h:92}}

function makeWall(){
  if(gameOver||gameWon)return;
  const w=wallRect();
  if(!earthWalls.some(e=>hit(w,e)))earthWalls.push(w);
}

function destroyWalls(){
  if(!earthWalls.length)return;
  earthWalls.forEach(w=>explosions.push({x:w.x+w.w/2,y:w.y+w.h/2,life:42,radius:8}));
  earthWalls.length=0;
}

addEventListener('keydown',e=>{
  if(e.code==='Tab')e.preventDefault();
  keys[e.key]=true;

  if(e.code==='Space'&&!e.repeat&&!gameOver&&!gameWon)player.flying=!player.flying;
  if(e.key==='Shift'&&!e.repeat)makeWall();
  if((e.key==='f'||e.key==='F')&&!e.repeat)destroyWalls();
  if(e.key==='Tab')player.invisible=true;
  if(e.key==='r'||e.key==='R')resetGame();
});

addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.key==='Tab')player.invisible=false;
});

document.getElementById('startBtn').onclick=async()=>{
  resetGame();
  document.getElementById('menu').classList.add('hidden');
  try{await document.documentElement.requestFullscreen()}catch(_){}
};

function moveWithWalls(obj,dx,dy){
  obj.x+=dx;
  for(const w of earthWalls){
    if(hit(obj,w)){
      if(dx>0)obj.x=w.x-obj.w;else if(dx<0)obj.x=w.x+w.w;
    }
  }
  obj.y+=dy;
  for(const w of earthWalls){
    if(hit(obj,w)){
      if(dy>0)obj.y=w.y-obj.h;else if(dy<0)obj.y=w.y+w.h;
    }
  }
}

function updatePlayer(){
  if(gameOver||gameWon)return;
  let dx=0,dy=0;
  if(keys.a||keys.ArrowLeft)dx-=player.speed;
  if(keys.d||keys.ArrowRight)dx+=player.speed;

  if(player.flying){
    if(keys.w||keys.ArrowUp)dy-=player.flySpeed;
    if(keys.s||keys.ArrowDown)dy+=player.flySpeed;
    moveWithWalls(player,dx,dy);
  }else{
    moveWithWalls(player,dx,velocityY);
    velocityY+=.55;
    const ground=canvas.height-120;
    if(player.y>ground){player.y=ground;velocityY=0}
  }

  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  player.y=Math.max(20,Math.min(canvas.height-115,player.y));
}

function updateStudents(){
  if(gameOver||gameWon)return;

  for(const s of students){
    const old={x:s.x,y:s.y,w:30,h:55};
    s.x+=s.vx;s.y+=s.vy;

    if(s.x<10||s.x>canvas.width-40)s.vx*=-1;
    if(s.y<50||s.y>canvas.height-145)s.vy*=-1;

    const r={x:s.x-15,y:s.y-45,w:30,h:55};
    for(const w of earthWalls){
      if(hit(r,w)){
        s.x=old.x;s.y=old.y;s.vx*=-1;s.vy*=-1;break;
      }
    }

    if(s.cooldown>0)s.cooldown--;

    const dx=player.x+player.w/2-s.x;
    const dy=player.y+player.h/2-(s.y-15);
    const dist=Math.hypot(dx,dy);

    if(dist<500&&s.cooldown<=0&&!player.invisible){
      projectiles.push({x:s.x,y:s.y-15,vx:dx/dist*5.5,vy:dy/dist*5.5,life:180});
      s.cooldown=70+Math.random()*45;
    }
  }
}

function updateProjectiles(){
  if(gameOver||gameWon)return;

  for(const p of projectiles){
    p.x+=p.vx;p.y+=p.vy;p.life--;
    const pr={x:p.x-4,y:p.y-4,w:8,h:8};

    if(earthWalls.some(w=>hit(pr,w))){p.life=0;continue}

    if(!player.invisible&&hit(pr,playerRect())){
      player.hp=Math.max(0,player.hp-5);
      p.life=0;
      if(player.hp<=0){gameOver=true;player.hp=0}
    }
  }

  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.life<=0||p.x<-30||p.x>canvas.width+30||p.y<-30||p.y>canvas.height+30)projectiles.splice(i,1);
  }
}

function updateExplosions(){
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i];
    e.life--;e.radius+=3.2;
    if(e.life<=0)explosions.splice(i,1);
  }
}

function update(){
  updatePlayer();
  updateStudents();
  updateProjectiles();
  updateExplosions();

  if(!gameOver&&!gameWon&&performance.now()-startTime>=SURVIVAL_TIME)gameWon=true;
}

function drawBackground(){
  ctx.fillStyle='#245d2a';
  ctx.fillRect(0,canvas.height-90,canvas.width,90);
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<24;i++){
    const x=(i*173)%canvas.width;
    const y=35+(i*79)%Math.max(120,canvas.height*.42);
    ctx.fillRect(x,y,2,2);
  }
}

function drawPerson(x,y,body,name,power){
  ctx.fillStyle='#f2c7a5';
  ctx.beginPath();ctx.arc(x,y-38,12,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=body;ctx.fillRect(x-10,y-25,20,30);
  ctx.fillRect(x-20,y-22,10,7);ctx.fillRect(x+10,y-22,10,7);
  ctx.fillRect(x-8,y+5,7,22);ctx.fillRect(x+1,y+5,7,22);

  ctx.fillStyle='#111';ctx.font='bold 13px Arial';ctx.textAlign='center';
  ctx.fillText(name,x,y-57);
  ctx.font='22px Arial';ctx.fillText(power,x,y-68);
  ctx.textAlign='left';
}

function drawStudents(){students.forEach(s=>drawPerson(s.x,s.y,'#283747',s.name,s.power))}

function drawPlayer(){
  if(player.invisible){
    ctx.fillStyle='rgba(180,220,255,.13)';
    ctx.fillRect(player.x,player.y,player.w,player.h);
    return;
  }

  ctx.fillStyle='#f2c7a5';
  ctx.beginPath();ctx.arc(player.x+21,player.y-15,15,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#111';ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#168cff';
  ctx.fillRect(player.x-12,player.y+8,12,40);
  ctx.fillRect(player.x+player.w,player.y+8,12,40);
  ctx.fillRect(player.x+7,player.y+player.h,10,27);
  ctx.fillRect(player.x+27,player.y+player.h,10,27);

  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';
  ctx.fillText('Ethan',player.x-2,player.y-34);
}

function drawWalls(){
  for(const w of earthWalls){
    ctx.fillStyle='#72502c';ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle='#a8733b';
    for(let y=w.y+10;y<w.y+w.h;y+=20)ctx.fillRect(w.x+8,y,w.w-16,5);
  }
}

function drawProjectiles(){
  for(const p of projectiles){
    ctx.beginPath();
    ctx.fillStyle='#ff4b22';ctx.shadowBlur=14;ctx.shadowColor='#ff7a00';
    ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
}

function drawExplosions(){
  for(const e of explosions){
    const a=e.life/42;ctx.globalAlpha=a;

    ctx.beginPath();ctx.fillStyle='#ff5a00';
    ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.fillStyle='#ffd21a';
    ctx.arc(e.x,e.y,e.radius*.55,0,Math.PI*2);ctx.fill();

    for(let i=0;i<6;i++){
      const ang=i*Math.PI/3+e.life*.1;
      ctx.fillStyle='#ff8c00';
      ctx.fillRect(e.x+Math.cos(ang)*e.radius,e.y+Math.sin(ang)*e.radius,5,5);
    }
    ctx.globalAlpha=1;
  }
}

function drawUI(){
  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';
  ctx.fillText('HP: '+player.hp,20,30);

  const left=Math.max(0,Math.ceil((SURVIVAL_TIME-(performance.now()-startTime))/1000));
  ctx.fillText('SURVIVE: '+left+'s',20,58);

  ctx.font='15px Arial';
  ctx.fillText('SPACE: Fly | SHIFT: Earth Wall | TAB: Shadow | F: Destroy Walls | R: Restart',20,84);

  if(gameOver||gameWon){
    ctx.fillStyle='rgba(0,0,0,.76)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.textAlign='center';

    ctx.fillStyle=gameWon?'#61ff72':'#ff4141';
    ctx.font='bold 72px Arial';
    ctx.fillText(gameWon?'YOU WIN!':'YOU DIED',canvas.width/2,canvas.height/2-20);

    ctx.fillStyle='#fff';ctx.font='25px Arial';
    ctx.fillText(gameWon?'Ethan survived for one minute!':'Ethan ran out of HP.',canvas.width/2,canvas.height/2+35);
    ctx.fillText('Press R to restart',canvas.width/2,canvas.height/2+80);
    ctx.textAlign='left';
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawWalls();
  drawExplosions();
  drawStudents();
  drawProjectiles();
  drawPlayer();
  drawUI();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
